<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">Redline Sky Atlas logo</title>
  <desc id="desc">A Redline-styled observatory lens around a Sky prism star beside the words Redline Sky Atlas.</desc>
  <defs>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="58%">
      <stop offset="0" stop-color="#f3e7ce" stop-opacity="0.82"/>
      <stop offset="0.28" stop-color="#c67267" stop-opacity="0.52"/>
      <stop offset="0.62" stop-color="#a63228" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#160e0d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skyCore" cx="48%" cy="45%" r="66%">
      <stop offset="0" stop-color="#f3e7ce"/>
      <stop offset="0.2" stop-color="#ff7a45"/>
      <stop offset="0.42" stop-color="#a63228"/>
      <stop offset="0.66" stop-color="#863bff"/>
      <stop offset="1" stop-color="#47bfff"/>
    </radialGradient>
    <linearGradient id="redlineStroke" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#c67267"/>
      <stop offset="0.56" stop-color="#a63228"/>
