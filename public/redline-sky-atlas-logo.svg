    <path d="M140 140 110 153 126 107Z" fill="#a63228" opacity="0.8"/>
    <path d="M80 140 94 107 110 153Z" fill="#c61f7c" opacity="0.62"/>
    <circle cx="110" cy="110" r="43" fill="none" stroke="#f3e7ce" stroke-width="1.5" opacity="0.55"/>
    <path d="M56 110h108M110 56v108" stroke="#f3e7ce" stroke-width="1.5" stroke-linecap="round" opacity="0.36"/>
