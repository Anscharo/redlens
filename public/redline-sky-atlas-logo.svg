    <text x="4" y="174" fill="#9a8a80" font-family="'Source Code Pro', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" letter-spacing="3.4">SEARCH • RELATIONS • HISTORY</text>
