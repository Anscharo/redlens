  <rect width="960" height="320" rx="44" fill="#0e0907"/>
  <path d="M54 242C178 183 284 164 406 181c136 19 252 9 385-54 42-20 76-31 112-35" fill="none" stroke="#3d2c28" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>
  <path d="M64 252C188 193 292 176 410 192c139 19 252 9 388-56 43-20 76-30 101-33" fill="none" stroke="#a63228" stroke-width="4" stroke-linecap="round" opacity="0.62"/>

