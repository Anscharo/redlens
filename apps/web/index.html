<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>:root{--bg:#160e0d}html[data-theme="giedi"]{--bg:#141414}html[data-theme="light"]{--bg:#fafafa}html{background-color:var(--bg)}</style>
    <link rel="icon" type="image/png" href="/icon-SMALL.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#160e0d" />
    <!-- Current live atlas sha, substituted at serve time (Bun in prod, a Vite
         dev plugin in dev). Drives the immutable /api/atlas/<sha>/ artifact base.
         Empty (cold boot / no injection) → loaders fall back to flat BASE_URL. -->
    <script>
      window.__ATLAS_SHA__ = "{{ATLAS_SHA}}";
      // Server's real login capability (true only when USERS_ENABLED + a JWT
      // secret are both set), substituted at serve time like the sha above. The
      // quoted-compare keeps an UNreplaced placeholder (static/no-server hosting)
      // a safe `false` instead of a syntax error. See src/lib/usersEnabled.ts.
      window.__USERS_ENABLED__ = "{{USERS_ENABLED}}" === "true";
      // Server's runtime capability for the chat feature (config.chatEnabled),
      // substituted at serve time like the flag above. Same quoted-compare
      // safety: an unreplaced placeholder (static/no-server hosting) yields a
      // safe `false`. See src/lib/chatEnabled.ts.
      window.__CHAT_ENABLED__ = "{{CHAT_ENABLED}}" === "true";
      // Which OAuth providers this environment offers, substituted at serve time
      // like the flag above (a CSV, e.g. "github" or "github,google"). Lets one
      // environment expose a single provider. An UNreplaced placeholder still
      // begins with "{{" → treated as "not injected" (see src/lib/authProviders.ts).
      window.__AUTH_PROVIDERS__ = "{{AUTH_PROVIDERS}}";
    </script>
    <script>
      // Applies the persisted theme before first paint, so a light-mode user
      // never sees a dark flash (and vice versa). Kept as a plain string read
      // (not JSON) and a hardcoded default of "dark" — no prefers-color-scheme
      // fallback, matching src/lib/theme.ts exactly, since that module can't
      // run yet. Must come BEFORE the palette-overrides script below: that
      // script only overrides individual CSS variables and doesn't touch
      // data-theme, but the anti-flash <style> above keys off data-theme, so
      // this has to land on <html> first.
      //
      // THEMES below is a hand-maintained twin of the registry in
      // src/lib/theme.ts (this script runs before any module can load, so it
      // cannot import it). theme-html-sync.test.ts parses this file and fails
      // if the two ever disagree — same arrangement as build-steps.mjs. It
      // also checks the prefers-color-scheme fallback below still names the
      // same theme as SYSTEM_LIGHT_THEME.
      (function () {
        var THEMES = {
          dark: { bg: "#160e0d", scheme: "dark" },
          giedi: { bg: "#141414", scheme: "dark" },
          light: { bg: "#fafafa", scheme: "light" },
        };
        try {
          var id = localStorage.getItem("redline-sky-atlas:theme");
          if (!id || !Object.prototype.hasOwnProperty.call(THEMES, id)) {
            // No stored pick: follow the device. Must happen HERE and not in
            // theme.ts, or a light-mode visitor gets a dark flash on every
            // cold load while the module graph resolves. Kept in sync with
            // systemTheme() / SYSTEM_LIGHT_THEME in src/lib/theme.ts.
            id =
              window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          }
          var t = THEMES[id];
          var root = document.documentElement;
          root.setAttribute("data-theme", id);
          root.setAttribute("data-scheme", t.scheme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", t.bg);
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("redline-sky-atlas:palette-overrides");
          if (!raw) return;
          var p = JSON.parse(raw);
          if (!p || p.v !== 1 || !p.values) return;
          var r = document.documentElement;
          for (var k in p.values) {
            if (Object.prototype.hasOwnProperty.call(p.values, k)) {
              r.style.setProperty("--" + k, p.values[k]);
            }
          }
        } catch (e) {}
      })();
    </script>
    <!-- Open Graph / Twitter card tags plus the page title element,
         substituted per-request at serve time (Bun in prod, the Vite dev
         plugin in dev). Doc links (/atlas?id=…) unfurl with the document's own
         title + summary; every other route gets the site default. See
         src/server/og.ts. An UNreplaced placeholder (static/no-server hosting)
         still leaves a valid head. -->
    {{OG_TAGS}}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-render-blocking: loads as print then swaps to all on load -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500;700&display=optional"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript
      ><link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500;700&display=optional"
        rel="stylesheet"
    /></noscript>
    <!-- preload: fetched promptly on the main thread on first render. Only the
         flat, NON-atlas-versioned STATIC FILES are hinted here — addresses.json
         is on-chain/shared and keeps a stable URL. Atlas-versioned artifacts
         (docs/glossary/addresses.atlas/relations) are now served from the
         per-sha /api/atlas/<sha>/ base injected at runtime, so they can't be
         hinted from static HTML; their workers/loaders fetch them immediately on
         app start regardless. The contract-state snapshot used to be hinted here
         too, back when it was a committed public/chain-state.json; it now comes
         from Postgres via GET /api/chain-state and is deliberately NOT hinted or
         SW-cached — a stale on-chain read is a data bug, not a speedup. -->
    <link rel="preload" href="/addresses.json" as="fetch" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
