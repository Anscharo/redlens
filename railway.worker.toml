# Railway config for the atlas worker cron service.
# This is a SEPARATE service from the web server (railway.toml).
# Deploy it as a second service in the same Railway project, pointing at this
# repo with this config file selected.
#
# The worker runs a full atlas build every 12 minutes, syncs all Postgres
# tables (atlas_doc_meta with content, atlas_addresses, sync_state, history,
# embeddings). The web service's in-process updater polls sync_state.atlas_sha
# and rebuilds its in-memory indexes from DB rows when it changes.
#
# Required env vars on the cron service (set in Railway dashboard):
#   DATABASE_URL        — same Postgres as the web service
#
# Optional:
#   GITHUB_TOKEN        — `gh api` calls for PR metadata in build-history
#   OPENROUTER_API_KEY  — embeddings (skipped gracefully if unset)
#   ATLAS_WORKER_FULL=1 — force full history rebuild (ignore Postgres cursor)
#   ETH_RPC_URL / RPC_URL_<CHAIN> — RPC overrides for chain-state + balances
#   CHAINSTATE_REFRESH_SECONDS — contract-state snapshot cadence (default daily)
#   BALANCES_REFRESH_SECONDS / BALANCES_REFRESH_BATCH — rolling address-balance
#                         refresh (default daily / 50 per lookup, one chain;
#                         a lookup happens at most once an hour)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"
# Worker image does not bundle markdown. Keep in sync with
# scripts/lib/deploy-skip.mjs railwayWorkerWatchPatterns().
watchPatterns = [
  "**",
  "!**/*.md",
  # The worker runs the atlas pipeline and syncs Postgres — it bundles no
  # frontend. Only the manifest matters, because the workspace install needs it
  # to resolve the lockfile. Generated by railwayWorkerWatchPatterns() in
  # scripts/lib/deploy-skip.mjs and asserted by scripts_tests/deploy-skip.test.ts.
  "!apps/web/**",
  "apps/web/package.json",
]

[deploy]
# Every 12 minutes. Lightweight check exits immediately if nothing changed.
cronSchedule = "*/12 * * * *"
startCommand = "bun scripts/required/atlas-worker.mjs"
