# Railway config for the atlas worker cron service.
# This is a SEPARATE service from the web server (railway.toml).
# Deploy it as a second service in the same Railway project, pointing at this
# repo with this config file selected.
#
# The worker runs a full atlas build every 12 minutes, syncs all Postgres
# tables (atlas_doc_meta with content, atlas_addresses, sync_state, history,
# embeddings). The web service's in-process updater polls sync_state.atlas_sha
# and rebuilds its in-memory indexes from DB rows when it changes.
#
# PR environments: Railway forks one environment per pull request (`redlens-pr-<n>`)
# from the base environment, with its own empty Postgres and the base's
# variables, API keys included. There the worker is INERT
# (src/server/pr-env/gate.ts): it builds the atlas commit the image cloned
# instead of fetching upstream, skips every step and tail that would call an
# outside API (explorers, RPCs, Discourse, GitHub, OpenRouter), and instead
# copies the PAU tables, chain_state and the address balances from the
# development database each tick, read-only. Two variables:
#   PR_ENV_SOURCE_DATABASE_URL — the development Postgres's PUBLIC URL (its TCP
#                         proxy; the private network does not span
#                         environments), logged in as a READ-ONLY role
#                         (scripts/CLAUDE.md, "PR environments"); the copy
#                         refuses a login that can write. Set on the base environment so every
#                         PR environment inherits it. Unset or unreachable:
#                         one warning a tick, and the environment keeps what
#                         it has; it never falls back to fetching.
#   PR_ENV_INERT        — 1/0 forces the mode on/off; unset, only an
#                         environment named <project>-pr-<n> (or pr-<n>) is inert.
# The worker logs which way the gate resolved as its first line.
#
# Required env vars on the cron service (set in Railway dashboard):
#   DATABASE_URL        — same Postgres as the web service
#
# Optional:
#   GITHUB_TOKEN        — `gh api` calls for PR metadata in build-history
#   OPENROUTER_API_KEY  — embeddings (skipped gracefully if unset)
#   ATLAS_WORKER_FULL=1 — force full history rebuild (ignore Postgres cursor).
#                         NOT needed for a fresh DB (per-PR environments
#                         included): an empty atlas_history / atlas_doc_versions
#                         yields a null cursor and both scripts walk everything
#                         on their own. Left set, it re-walks every tick and
#                         disables the fast-exit — see atlas-worker.mjs.
#   ETH_RPC_URL / RPC_URL_<CHAIN> — RPC overrides for chain-state + balances
#   CHAINSTATE_REFRESH_SECONDS — contract-state snapshot cadence (default daily)
#   BALANCES_REFRESH_SECONDS / BALANCES_REFRESH_BATCH — rolling address-balance
#                         refresh (default daily / 50 per lookup, one chain;
#                         a lookup happens at most once an hour)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"
# Worker image does not bundle markdown. Keep in sync with
# scripts/lib/deploy-skip.ts railwayWorkerWatchPatterns().
watchPatterns = [
  "**",
  "!**/*.md",
  # The worker runs the atlas pipeline and syncs Postgres — it bundles no
  # frontend. Only the manifest matters, because the workspace install needs it
  # to resolve the lockfile. Generated by railwayWorkerWatchPatterns() in
  # scripts/lib/deploy-skip.ts and asserted by scripts_tests/deploy-skip.test.ts.
  "!apps/web/**",
  "apps/web/package.json",
]

[deploy]
# Every 12 minutes. Lightweight check exits immediately if nothing changed.
cronSchedule = "*/12 * * * *"
startCommand = "bun scripts/required/atlas-worker.mjs"
