# TEMPORARY. Settles one question for PR #417: which credential, if any, can
# read sky-ecosystem/next-gen-atlas pull requests from this repository's runner.
# ATLAS_PR_TOKEN (a public-repo PAT) is set and the bump step uses it. This
# probe measures whether the built-in token could have done the job instead,
# and whether REST reaches what GraphQL cannot. Delete this file once read.
name: TMP upstream token probe

on:
  pull_request:

jobs:
  probe:
    if: github.head_ref == 'pr-cache'
    runs-on: ubuntu-latest
    steps:
      - name: graphql via gh pr view (what fetchPr uses today)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr view 341 --repo sky-ecosystem/next-gen-atlas --json title

      - name: rest single pull
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/sky-ecosystem/next-gen-atlas/pulls/341 --jq '{title,body_len:(.body|length),author:.user.login,comments}'

      - name: rest reviews
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/sky-ecosystem/next-gen-atlas/pulls/341/reviews --jq 'map(.state) | {count:length, approved:(map(select(.=="APPROVED"))|length)}'
