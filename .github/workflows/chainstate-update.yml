name: Chainstate Update

on:
  workflow_dispatch:
  schedule:
    # Weekly Sunday 22:00 UTC. Self-aborts if on-chain artifacts are unchanged.
    - cron: "0 22 * * 0"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    # Reuses the ATLAS_BOT GitHub App credentials and ETHERSCAN_API_KEY from
    # the atlas-update environment. The App token lets the push + PR trigger CI.
    environment: atlas-update-main-bypass
    steps:
      - name: Generate ATLAS_BOT app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ATLAS_BOT_APP_ID }}
          private-key: ${{ secrets.ATLAS_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build:addresses reads gitignored addresses.atlas.json from build:index.
      - name: Build index
        run: pnpm build:index

      # Refresh committed addresses.json + Etherscan cache. Degrades gracefully
      # on flaky Etherscan calls — snap:chainstate still runs against the
      # existing committed artifacts. REFRESH_PROXY_CACHE re-verifies cached
      # proxy metadata so a proxy upgraded since last week is picked up.
      - name: Refresh on-chain address metadata
        continue-on-error: true
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          REFRESH_PROXY_CACHE: "1"
        run: pnpm build:addresses

      - name: Snapshot chain state
        env:
          # Optional — falls back to CHAIN_RPC.ethereum in scripts/lib/chains.mjs.
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        run: pnpm snap:chainstate

      - name: Check for changes
        id: diff
        run: |
          # chain-state.json embeds a live block number that changes every run,
          # so compare only its `.values` payload — a pure block bump is not a
          # real on-chain change and must not open a no-op PR.
          values_changed=false
          if [ -f public/chain-state.json ]; then
            NEW_VALUES=$(node -e "console.log(JSON.stringify(JSON.parse(require('fs').readFileSync('public/chain-state.json','utf8')).values))")
            OLD_VALUES=$(git show HEAD:public/chain-state.json 2>/dev/null \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.stringify(JSON.parse(s).values))}catch{console.log('')}})")
            [ "$NEW_VALUES" != "$OLD_VALUES" ] && values_changed=true
          fi
          # addresses.json + Etherscan cache: use `git status --porcelain` so NEW
          # untracked cache files are detected too (git diff --quiet ignores them).
          meta_changed=false
          [ -n "$(git status --porcelain -- public/addresses.json .cache/etherscan)" ] && meta_changed=true

          if [ "$values_changed" = true ] || [ "$meta_changed" = true ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            BLOCK=$(node -e "console.log(JSON.parse(require('fs').readFileSync('public/chain-state.json','utf8')).block)")
            echo "block=$BLOCK" >> "$GITHUB_OUTPUT"
            echo "On-chain values or address metadata changed (values_changed=$values_changed meta_changed=$meta_changed)."
            git status --porcelain -- public/chain-state.json public/addresses.json .cache/etherscan
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "On-chain values + address metadata unchanged (block-only bump ignored) — nothing to commit."
          fi

      - name: Commit and push to chainstate-update branch
        if: steps.diff.outputs.proceed == 'true'
        id: push
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="chainstate-update/${DATE}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add public/chain-state.json public/addresses.json .cache/etherscan
          git commit -m "chore: refresh chainstate snapshot"
          git push origin "$BRANCH" --force
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open or update chainstate-update PR
        if: steps.diff.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BLOCK="${{ steps.diff.outputs.block }}"
          BRANCH="${{ steps.push.outputs.branch }}"

          gh label create chainstate-update --force \
            --color 1D76DB \
            --description "Automated weekly chainstate snapshot refresh"

          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open for $BRANCH — nothing to do."
          else
            gh pr create \
              --title "chore: refresh chainstate snapshot" \
              --body "Automated weekly refresh of on-chain contract values at Ethereum block \`${BLOCK}\`." \
              --label "chainstate-update" \
              --base main \
              --head "$BRANCH"
            PR_NUM=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
            gh pr merge "$PR_NUM" --auto --rebase
            echo "Opened PR #${PR_NUM} with auto-merge (rebase) enabled."
          fi
