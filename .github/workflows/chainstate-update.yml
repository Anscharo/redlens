name: On-chain Address Refresh

# Weekly refresh of the COMMITTED on-chain address metadata: public/addresses.json
# plus the .cache/etherscan ABI cache it (and the atlas worker's chain-state
# snapshot) are built from.
#
# The contract-state snapshot itself is NOT built here any more — public/chain-state.json
# is decommitted, and the Railway atlas worker fetches the snapshot straight into
# Postgres on its own time gate (CHAINSTATE_REFRESH_SECONDS, default daily). What
# remains here is the part that must stay in git: the address metadata that
# build-graph reads at build time, and the ABI cache that ships in the worker
# image. The workflow file/branch/label names keep their historical
# "chainstate-update" spelling — they exist in GitHub already.

on:
  workflow_dispatch:
  schedule:
    # Weekly Sunday 22:00 UTC. Self-aborts if the on-chain artifacts are unchanged.
    - cron: "0 22 * * 0"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    # Reuses the ATLAS_BOT GitHub App credentials and ETHERSCAN_API_KEY from
    # the atlas-update environment. The App token lets the push + PR trigger CI.
    environment: atlas-update-main-bypass
    steps:
      - name: Generate ATLAS_BOT app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ATLAS_BOT_APP_ID }}
          private-key: ${{ secrets.ATLAS_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build:addresses reads gitignored addresses.atlas.json from build:index.
      - name: Build index
        run: pnpm build:index

      # Refresh committed addresses.json + Etherscan cache. Degrades gracefully
      # on flaky Etherscan calls — an unchanged tree just means no PR.
      # REFRESH_PROXY_CACHE re-verifies cached proxy metadata so a proxy upgraded
      # since last week is picked up (the worker's snapshot reads view functions
      # off the IMPLEMENTATION ABI, so a stale proxy entry silently narrows it).
      # BLOCKSCOUT_API_KEY (optional) raises the Blockscout rate limit used for
      # Robinhood Chain + as the Etherscan fallback.
      - name: Refresh on-chain address metadata
        continue-on-error: true
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
          REFRESH_PROXY_CACHE: "1"
        run: pnpm build:addresses

      - name: Check for changes
        id: diff
        run: |
          # addresses.json + Etherscan cache: use `git status --porcelain` so NEW
          # untracked cache files are detected too (git diff --quiet ignores them).
          if [ -n "$(git status --porcelain -- public/addresses.json .cache/etherscan)" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Address metadata changed."
            git status --porcelain -- public/addresses.json .cache/etherscan
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Address metadata unchanged — nothing to commit."
          fi

      - name: Commit and push to chainstate-update branch
        if: steps.diff.outputs.proceed == 'true'
        id: push
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="chainstate-update/${DATE}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add public/addresses.json .cache/etherscan
          git commit -m "chore: refresh on-chain address metadata"
          git push origin "$BRANCH" --force
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open or update chainstate-update PR
        if: steps.diff.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH="${{ steps.push.outputs.branch }}"

          gh label create chainstate-update --force \
            --color 1D76DB \
            --description "Automated weekly on-chain address metadata refresh"

          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open for $BRANCH — nothing to do."
          else
            gh pr create \
              --title "chore: refresh on-chain address metadata" \
              --body "Automated weekly refresh of \`public/addresses.json\` and the Etherscan ABI cache. The contract-state snapshot is fetched by the Railway atlas worker into Postgres and is not part of this PR." \
              --label "chainstate-update" \
              --base main \
              --head "$BRANCH"
            PR_NUM=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
            gh pr merge "$PR_NUM" --auto --rebase
            echo "Opened PR #${PR_NUM} with auto-merge (rebase) enabled."
          fi
