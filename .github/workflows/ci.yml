name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # Which half of the workspace a PR touches. Used to skip the jobs that a
  # frontend-only change provably cannot affect: the Postgres/MCP server suite
  # and the graph snapshots both derive from src/server, scripts/ and the atlas,
  # none of which apps/web can reach.
  #
  # Deliberately fails OPEN — anything other than a clean "only apps/web changed"
  # answer runs the full set. A wrongly-skipped gate is worth far more than the
  # couple of minutes it saves.
  #
  # Plain git rather than a paths-filter action: it is a three-line diff and this
  # keeps the supply chain as-is.
  #
  # NOTE: if these job names are configured as REQUIRED status checks, a skipped
  # job reports "skipped" and branch protection may hold the PR. Either mark them
  # not-required or make them required-if-run before relying on this.
  changes:
    name: "CI: What changed"
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify the diff
        id: filter
        run: |
          set -eu
          emit() { echo "backend=$1" >> "$GITHUB_OUTPUT"; echo "backend=$1"; exit 0; }
          [ "${{ github.event_name }}" = "pull_request" ] || emit true
          base='${{ github.event.pull_request.base.sha }}'
          git cat-file -e "$base^{commit}" 2>/dev/null || emit true
          changed=$(git diff --name-only "$base"...HEAD)
          [ -n "$changed" ] || emit true
          echo "$changed" | sed 's/^/  /'
          # Any path outside apps/web/ means the backend half is in play. So does
          # apps/web's own manifest: both images copy it so the workspace install
          # can resolve the lockfile, so it is not purely frontend.
          echo "$changed" | grep -qvE '^apps/web/' && emit true
          echo "$changed" | grep -qxF 'apps/web/package.json' && emit true
          emit false

  checkout-install:
    name: "CI: Checkout + install"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Pack installed workspace
        # Both package trees. pnpm puts apps/web's links in a sibling
        # apps/web/node_modules, so packing only the root one leaves the six jobs
        # that restore this artifact unable to resolve anything apps/web depends
        # on — which is how `tsc -b` first failed on the workspace split.
        run: tar -czf workspace-deps.tgz node_modules apps/web/node_modules

      - name: Upload installed workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace-deps
          path: workspace-deps.tgz
          retention-days: 1

  lint-build:
    name: "CI: Checkout submodule + lint + build"
    runs-on: ubuntu-latest
    needs: checkout-install
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Download installed workspace
        uses: actions/download-artifact@v5
        with:
          name: workspace-deps

      - name: Restore installed workspace
        run: tar -xzf workspace-deps.tgz

      - uses: ./.github/actions/setup
        with:
          install: "false"

      - name: Build index
        run: pnpm build:index

      # Fails the PR check if the build didn't account for every document in the
      # atlas source — so an atlas bump pushed outside atlas-update.yml (which
      # gates this before opening its PR) still cannot merge an empty atlas.
      - name: Verify the build read the whole atlas
        run: pnpm check:atlas

      - name: Build glossary
        run: pnpm build:glossary

      - name: Build graph
        run: pnpm build:graph

      - name: Pack atlas artifacts
        run: tar -czf atlas-artifacts.tgz public/docs.json public/search-index.json public/glossary.json public/graph.json public/relations.json public/addresses.atlas.json

      - name: Upload atlas artifacts
        uses: actions/upload-artifact@v4
        with:
          name: atlas-artifacts
          path: atlas-artifacts.tgz
          retention-days: 1

      # manifest.json is a build artifact (not committed). manifest.test.ts
      # skips itself when it's absent, so no build:manifest step needed here.
      - name: Type check
        run: pnpm build:ts

      - name: Type check E2E
        run: pnpm test:e2e:types

      - name: Lint
        run: pnpm lint

      - name: Unused files/exports (knip)
        run: pnpm knip

      - name: Service/frontend import boundary
        run: pnpm check:boundaries

      - name: Check patch notes
        run: pnpm check:patch-notes

      - name: Bundle
        run: pnpm build:vite

  test-snap:
    name: "CI: Test snaps"
    runs-on: ubuntu-latest
    needs: [changes, lint-build]
    # Graph snapshots come from relations.json, which apps/web cannot influence.
    if: needs.changes.outputs.backend == 'true' 
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Download installed workspace
        uses: actions/download-artifact@v5
        with:
          name: workspace-deps

      - name: Restore installed workspace
        run: tar -xzf workspace-deps.tgz

      - name: Download atlas artifacts
        uses: actions/download-artifact@v5
        with:
          name: atlas-artifacts

      - name: Restore atlas artifacts
        run: tar -xzf atlas-artifacts.tgz

      - uses: ./.github/actions/setup
        with:
          install: "false"

      - name: Verify graph snapshots
        run: pnpm test:snap

  coverage-vitest:
    name: "CI: Test Coverage (Vitest)"
    runs-on: ubuntu-latest
    needs: lint-build
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Download installed workspace
        uses: actions/download-artifact@v5
        with:
          name: workspace-deps

      - name: Restore installed workspace
        run: tar -xzf workspace-deps.tgz

      - name: Download atlas artifacts
        uses: actions/download-artifact@v5
        with:
          name: atlas-artifacts

      - name: Restore atlas artifacts
        run: tar -xzf atlas-artifacts.tgz

      - uses: ./.github/actions/setup
        with:
          install: "false"

      - name: Run Vitest coverage
        run: pnpm test:coverage
        env:
          REPRO: "1"

      - name: Upload Vitest coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-vitest
          path: coverage/vitest/lcov.info
          retention-days: 14

  coverage-bun:
    name: "CI: Test Coverage (Bun)"
    runs-on: ubuntu-latest
    needs: lint-build
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Download installed workspace
        uses: actions/download-artifact@v5
        with:
          name: workspace-deps

      - name: Restore installed workspace
        run: tar -xzf workspace-deps.tgz

      - name: Download atlas artifacts
        uses: actions/download-artifact@v5
        with:
          name: atlas-artifacts

      - name: Restore atlas artifacts
        run: tar -xzf atlas-artifacts.tgz

      - uses: ./.github/actions/setup
        with:
          bun: "true"
          install: "false"

      - name: Run Bun coverage
        run: pnpm test:server:coverage

      - name: Upload Bun coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-bun
          path: coverage/bun/lcov.info
          retention-days: 14

  coverage:
    name: "CI: Coverage summary"
    runs-on: ubuntu-latest
    needs: [coverage-vitest, coverage-bun]
    steps:
      # fetch-depth: 0 so coverage-areas.mjs can diff changed lines against
      # origin/main. No submodule / atlas artifacts needed here anymore — this
      # job only reads the two lcov artifacts + the cached main baseline.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download installed workspace
        uses: actions/download-artifact@v5
        with:
          name: workspace-deps

      - name: Restore installed workspace
        run: tar -xzf workspace-deps.tgz

      - uses: ./.github/actions/setup
        with:
          install: "false"

      # Read main's precomputed coverage baseline (produced once per push to main
      # by coverage-baseline.yml) instead of rebuilding + re-running both suites
      # against main on every PR. The exact key never matches on a PR (github.sha
      # is the merge sha), so the restore-keys prefix returns the most recent
      # main baseline. On a cold cache the file is simply absent and
      # coverage-areas.mjs degrades to blank Base/Δ columns for that one run.
      - name: Restore main coverage baseline
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/cache/restore@v4
        with:
          path: base-coverage-areas.json
          key: coverage-base-${{ github.sha }}
          restore-keys: |
            coverage-base-

      - name: Download Vitest coverage
        uses: actions/download-artifact@v5
        with:
          name: coverage-vitest
          path: coverage/vitest

      - name: Download Bun coverage
        uses: actions/download-artifact@v5
        with:
          name: coverage-bun
          path: coverage/bun

      - name: Summarize coverage areas and enforce changed-code minimum
        run: pnpm coverage:areas
        env:
          COVERAGE_CHANGED_MIN: "85"
          # 85% of changed logic lines, or all but one of them — whichever is
          # kinder. A percentage can't resolve a 3-line diff (0/33/67/100), so
          # one uncovered guard used to score 67% and fail a gate that a
          # 100-line PR clears with 15 uncovered lines. The same rule is applied
          # to the whole diff, so the per-area grace can't stack across meters.
          COVERAGE_CHANGED_GRACE: "1"
          COVERAGE_BASE_REF: origin/${{ github.base_ref || 'main' }}
          COVERAGE_BASELINE_JSON: base-coverage-areas.json

      - name: Upload coverage artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/vitest/lcov.info
            coverage/bun/lcov.info
            coverage/coverage-areas.json
            coverage/coverage-summary.md
          retention-days: 14

      - name: Comment coverage summary
        # Fork PRs get a read-only GITHUB_TOKEN — issues.createComment/updateComment
        # would 403 there, failing the job after tests + the coverage gate already
        # passed. Skip on forks; continue-on-error covers any other transient
        # failure (rate limit, etc.) since this step is a notification, not a gate.
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- redlens-coverage-summary -->';
            const summary = fs.existsSync('coverage/coverage-summary.md')
              ? fs.readFileSync('coverage/coverage-summary.md', 'utf8')
              : 'Coverage summary was not generated.';
            const body = `${marker}\n${summary}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find((comment) => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  server:
    name: "CI: Railway server (Postgres + MCP smoke)"
    runs-on: ubuntu-latest
    needs: [changes, lint-build]
    # src/server + scripts only; nothing under apps/web reaches them.
    if: needs.changes.outputs.backend == 'true' 
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: redlens
          POSTGRES_PASSWORD: redlens
          POSTGRES_DB: redlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U redlens -d redlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://redlens:redlens@localhost:5432/redlens
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # Full history so sync:atlas can derive commit_seq from atlas git-log
          # order; sync degrades gracefully (commit_seq=null) if it's shallow.
          fetch-depth: 0

      - name: Download installed workspace
        uses: actions/download-artifact@v5
        with:
          name: workspace-deps

      - name: Restore installed workspace
        run: tar -xzf workspace-deps.tgz

      - name: Download atlas artifacts
        uses: actions/download-artifact@v5
        with:
          name: atlas-artifacts

      - name: Restore atlas artifacts
        run: tar -xzf atlas-artifacts.tgz

      - uses: ./.github/actions/setup
        with:
          bun: "true"
          install: "false"

      - name: Type check server
        run: pnpm exec tsc -p tsconfig.server.json --noEmit

      - name: Unit tests (tool layer)
        run: pnpm test:server

      # End-to-end: migration runner + structural sync against a fresh Postgres.
      # Embeddings are NOT run in CI (no OPENROUTER_API_KEY by design) — semantic
      # search just stays empty; lexical / graph / structural paths are exercised.
      - name: "sync:atlas (migrations + structural sync)"
        run: bun run sync:atlas

      - name: Health + MCP integration smoke
        # Updater is on by default now; disable it in the smoke boot so no
        # background poll/rebuild races the short-lived health/MCP checks.
        env:
          ATLAS_UPDATE_ENABLED: "0"
        run: |
          bun src/server/index.ts &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS localhost:3000/api/health >/dev/null 2>&1 && break; sleep 1; done
          # Reuse the deployed-boundary smoke against this deterministic fresh
          # Postgres. It calls atlas_query and verifies a document addressRef
          # resolves through atlas_get_address; no browser binary is needed.
          BASE_URL=http://localhost:3000 pnpm exec playwright test e2e/smoke.spec.ts --project=core --reporter=list
