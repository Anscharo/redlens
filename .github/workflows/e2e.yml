name: E2E

# Three ways in:
#  1. deployment_status — Railway emits this when a per-PR environment finishes
#     deploying. Keying off `state == success` removes the "tests started before
#     the deploy was ready" race; we further scope to PR envs via `environment`
#     containing 'pr-' so production deploys don't trigger the suite. The public
#     hostname is `redlens-<environment-slug>.up.railway.app`, where the slug
#     (e.g. "pr-85d143-128") embeds a random per-environment component Railway
#     assigns once and keeps stable across redeploys of the same PR — it is NOT
#     derivable from the PR number alone, so we always read it from the actual
#     `environment` field rather than reconstructing it.
#  2. workflow_dispatch — manual run against an explicit deployment URL (the
#     slug can't be derived from a PR number alone, so this takes the full URL
#     directly rather than looking it up). Useful to smoke the workflow before
#     it's on main (a deployment_status workflow only fires once its file is on
#     the default branch) or to re-run E2E on demand.
#  3. schedule — canary-only runs against the long-lived environments: prod
#     once a day, development twice a day. Cron can't carry inputs, so the
#     target is derived from which cron string fired (github.event.schedule) in
#     "Resolve target URL" — keep the crons there and the map below in sync.
#     Times are staggered (off :00, hours apart) so runs never overlap each
#     other or GitHub's top-of-hour congestion. Scheduled runs skip the core
#     project: core is the per-PR deploy gate; these exist to exercise the
#     cron/external-state canaries against live data. The preview canary
#     self-discovers a live atlas PR on scheduled runs (PREVIEW_CANARY_DISCOVER
#     in e2e/preview-canary.ts) and skips honestly when none is eligible;
#     e2e/check-canary-skips.mjs counts consecutive scheduled skips in a
#     cache-persisted file and fails the run once the streak crosses its
#     threshold, so "previews untested for days" is red, not silent.
#
# Markdown-only PRs (skills, CLAUDE.md, plans — anything the app does not
# `?raw`-import) should not reach here: railway.toml watchPatterns skip the
# deploy. This job still no-ops if Railway emits a status anyway, so Playwright
# does not wait on a PR env that will never converge for a docs-only change.
#
# This workflow is NOT the required status check, and its job is deliberately
# named "E2E run" rather than `e2e` so it cannot collide with the one that is.
# It cannot be required: on a markdown-only PR nothing deploys, so no
# deployment_status fires, so nothing here reports — and an unreported required
# check blocks the PR forever ("Expected — Waiting for status to be reported").
# `.github/workflows/e2e-gate.yml` owns the required `e2e` check instead: it
# runs on `pull_request`, always reports, and mirrors this workflow's verdict
# when a deploy is expected. Renaming this job means renaming what that gate's
# comments describe — not what it matches on, which is this WORKFLOW FILE.
on:
  deployment_status:
  schedule:
    - cron: "23 5 * * *" # prod canary (05:23 UTC daily)
    - cron: "23 11 * * *" # development canary #1 (11:23 UTC)
    - cron: "23 23 * * *" # development canary #2 (23:23 UTC)
  workflow_dispatch:
    inputs:
      url:
        description: "Full deployment URL to test against (e.g. https://redlens-pr-85d143-128.up.railway.app)"
        required: true
        type: string
      atlas_preview_canary_pr:
        description: "Optional next-gen-atlas PR number for the pinned preview canary"
        required: false
        type: string
      atlas_preview_canary_sha:
        description: "Required with atlas_preview_canary_pr: exact current head SHA to test"
        required: false
        type: string
      run_canaries:
        description: "Also run cron/external-state history and Atlas-preview canaries"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

jobs:
  e2e:
    # Distinct from the required check's name (`e2e`, owned by e2e-gate.yml) —
    # Railway emits a deployment_status per service and per environment, so one
    # commit gets several runs of this workflow and some conclude `skipped`.
    # Branch protection resolves a required check by name, so letting those
    # share a name with the gate would let a `skipped` sibling stand in for a
    # verdict nobody reached.
    name: E2E run
    # Manual dispatch always runs. For deployment_status, gate on a successful
    # PR-environment deploy. Railway's `environment` is like
    # "Redline Atlas / redlens-pr-323" (service-name-pr-N; older envs used
    # "pr-<random>-<N>"), while `environment_url` is the Railway *console* link,
    # not the app — so we gate on `environment` containing 'pr-' (prod envs
    # don't) and derive the app URL below.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event.deployment_status.state == 'success' &&
       contains(github.event.deployment_status.environment, 'pr-'))
    # Workflow-level concurrency keyed only on the Railway environment cancelled
    # HEAD's suite whenever a *later* success event arrived for an *earlier*
    # commit of the same PR env (GitHub cancels the in-progress run, not the
    # older SHA). `in_progress` statuses also start a workflow run, so they
    # participated in that group even though the job then skipped.
    #
    # Job-level + environment+sha: skipped non-success events never take the
    # lock, and a delayed success for commit A cannot cancel commit B. Same
    # SHA still cancel-in-progress (two services finishing the same build).
    # Stale SHAs are skipped in the first step; EXPECTED_APP_COMMIT is the
    # backstop if the mutable URL has already moved on.
    concurrency:
      group: e2e-${{ github.event_name == 'schedule' && format('cron-{0}', github.event.schedule) || github.event_name == 'deployment_status' && format('{0}-{1}', github.event.deployment_status.environment, github.event.deployment.sha) || github.event.inputs.url }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      # Inline (not a repo script) so a skills-only PR that doesn't contain
      # scripts/lib/deploy-skip.mjs still skips. Allowlist = APP_READ_MARKDOWN
      # in that module: patch-notes.md, PRIVACY.md,
      # docs/risk-assessment-rubric.md, docs/crossview/concepts.md,
      # docs/crossview/concepts-audit.md.
      - name: Decide whether to run E2E
        id: gate
        if: github.event_name == 'deployment_status'
        env:
          GH_TOKEN: ${{ github.token }}
          ENV_NAME: ${{ github.event.deployment_status.environment }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
        run: |
          set -euo pipefail
          SLUG="$(printf '%s' "$ENV_NAME" | awk -F'/' '{print $NF}' | xargs)"
          PR="$(printf '%s' "$SLUG" | sed -nE 's/.*pr-([a-f0-9]+-)?([0-9]+)$/\2/p')"
          skip=false
          reason=""
          if [ -z "$PR" ]; then
            echo "could not parse a PR number from '${ENV_NAME}'; running E2E"
          else
            files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[].filename' || true)"
            if [ -z "$files" ]; then
              echo "PR #${PR} file list empty; running E2E"
            else
              relevant=""
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                case "$f" in
                  patch-notes.md|PRIVACY.md|docs/risk-assessment-rubric.md|docs/crossview/concepts.md|docs/crossview/concepts-audit.md)
                    relevant=1
                    ;;
                  *.md|*.MD)
                    ;;
                  *)
                    relevant=1
                    ;;
                esac
              done <<< "$files"
              if [ -z "$relevant" ]; then
                skip=true
                reason="PR #${PR} only changes markdown the app does not read; skipping E2E"
                echo "$reason"
              else
                echo "PR #${PR} has deploy-relevant files; running E2E"
              fi
            fi
            # A delayed `success` for an earlier commit of the same PR env must
            # not run Playwright: the URL is mutable and already serves HEAD
            # (EXPECTED_APP_COMMIT then fails after a 2-minute health wait).
            if [ "$skip" != true ] && [ -n "${DEPLOY_SHA}" ]; then
              HEAD_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq .head.sha 2>/dev/null || true)"
              if [ -n "$HEAD_SHA" ] && [ "$DEPLOY_SHA" != "$HEAD_SHA" ]; then
                skip=true
                reason="PR #${PR} head is ${HEAD_SHA}; this deploy ${DEPLOY_SHA} is superseded; skipping E2E"
                echo "$reason"
              fi
            fi
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

      - name: Skipping E2E
        if: ${{ steps.gate.outputs.skip == 'true' }}
        run: echo "${{ steps.gate.outputs.reason }}"

      - uses: actions/checkout@v5
        if: ${{ github.event_name == 'workflow_dispatch' || steps.gate.outputs.skip != 'true' }}
        with:
          # deployment_status is not a branch/tag event; pin the deployed SHA
          # so the suite matches the image under test (schedule/dispatch have
          # no deployment and fall through to github.sha).
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Resolve target URL
        id: target
        if: ${{ github.event_name == 'workflow_dispatch' || steps.gate.outputs.skip != 'true' }}
        env:
          ENV_NAME: ${{ github.event.deployment_status.environment }}
          URL_INPUT: ${{ github.event.inputs.url }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Cron carries no inputs, so the fired cron string IS the target
            # selector. Fail loudly on an unmapped cron: silently defaulting
            # would let an edited schedule test the wrong environment.
            case "$SCHEDULE" in
              "23 5 * * *") URL="https://atlas.redline.support" ;;
              "23 11 * * *"|"23 23 * * *") URL="https://redlens-development.up.railway.app" ;;
              *)
                echo "cron '${SCHEDULE}' has no target URL mapped in this step" >&2
                exit 1
                ;;
            esac
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual runs pass the deployment URL directly — the env slug (e.g.
            # "pr-85d143-128") embeds a random per-environment component that
            # isn't derivable from a PR number, so there's nothing to look up.
            URL="${URL_INPUT%/}"
            if [ -z "$URL" ]; then
              echo "no deployment URL provided" >&2
              exit 1
            fi
          else
            # "Redline Atlas / pr-85d143-128" -> "pr-85d143-128"
            SLUG="$(printf '%s' "$ENV_NAME" | awk -F'/' '{print $NF}' | xargs)"
            if [ -z "$SLUG" ]; then
              echo "could not parse an environment slug from '${ENV_NAME}'" >&2
              exit 1
            fi
            URL="https://redlens-${SLUG}.up.railway.app"
          fi
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup
        if: ${{ github.event_name == 'workflow_dispatch' || steps.gate.outputs.skip != 'true' }}

      # Browser blobs live in ~/.cache/ms-playwright (~114MB for Chromium).
      # OS packages from --with-deps are NOT in this cache (they install onto
      # the runner), so a hit still runs apt — it just skips the download.
      # That download is the long pole: deploy readiness is polled later in
      # e2e/global-setup.ts and does not overlap this step. Recent PR deploys
      # were already healthy in ~1s after install finished, so a cache hit is
      # real wall-clock savings rather than hiding a database wait.
      - name: Cache Playwright browsers
        if: ${{ github.event_name == 'workflow_dispatch' || steps.gate.outputs.skip != 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        if: ${{ github.event_name == 'workflow_dispatch' || steps.gate.outputs.skip != 'true' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Run core E2E
        # Not on schedule: core gates per-PR deploys; scheduled runs are the
        # canary sweep only.
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'deployment_status' && steps.gate.outputs.skip != 'true') }}
        run: pnpm test:e2e
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
          EXPECTED_APP_COMMIT: ${{ github.event.deployment.sha }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/core
          PLAYWRIGHT_OUTPUT_DIR: test-results/core
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/core-report.json

      # The preview-canary skip streak survives between scheduled runs in a
      # cache-persisted counter file. Cache keys are immutable, so each run
      # saves under its own run_id and the next restores the newest via the
      # prefix restore-key.
      - name: Restore canary skip streak
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_canaries) }}
        uses: actions/cache/restore@v4
        with:
          path: .canary-streak
          key: preview-canary-streak-${{ github.run_id }}
          restore-keys: |
            preview-canary-streak-

      - name: Run canaries (scheduled or opt-in)
        # Scheduled runs self-discover a live atlas PR for the preview canary;
        # dispatch runs use the ATLAS_PREVIEW_CANARY_* pins when provided and
        # skip the preview canary otherwise.
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_canaries) }}
        run: pnpm test:e2e:canary
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/canary
          PLAYWRIGHT_OUTPUT_DIR: test-results/canary
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/canary-report.json
          # Lets the preview canary query the GitHub API without hitting the
          # 60/hr unauthenticated limit.
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_CANARY_DISCOVER: ${{ github.event_name == 'schedule' && '1' || '' }}
          ATLAS_PREVIEW_CANARY_PR: ${{ github.event.inputs.atlas_preview_canary_pr }}
          ATLAS_PREVIEW_CANARY_SHA: ${{ github.event.inputs.atlas_preview_canary_sha }}

      - name: Guard against silent preview-canary skips
        # !cancelled(): the streak must update (and reset on a real canary
        # failure — it RAN) even when the canary step itself went red.
        if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_canaries)) }}
        run: node e2e/check-canary-skips.mjs
        env:
          REPORT_FILE: test-results/canary-report.json
          STREAK_FILE: .canary-streak/streak
          EVENT_NAME: ${{ github.event_name }}

      - name: Save canary skip streak
        if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_canaries)) }}
        uses: actions/cache/save@v4
        with:
          path: .canary-streak
          key: preview-canary-streak-${{ github.run_id }}

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || steps.gate.outputs.skip != 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 7
