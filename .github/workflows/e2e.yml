name: E2E

# Two ways in:
#  1. deployment_status — Railway emits this when a per-PR environment finishes
#     deploying. Keying off `state == success` removes the "tests started before
#     the deploy was ready" race; we further scope to PR envs via `environment`
#     containing 'pr-' so production deploys don't trigger the suite. The public
#     hostname is `redlens-<environment-slug>.up.railway.app`, where the slug
#     (e.g. "pr-85d143-128") embeds a random per-environment component Railway
#     assigns once and keeps stable across redeploys of the same PR — it is NOT
#     derivable from the PR number alone, so we always read it from the actual
#     `environment` field rather than reconstructing it.
#  2. workflow_dispatch — manual run against any PR number. Since the slug can't
#     be derived from the number, this looks up the most recent GitHub
#     deployment recorded for that PR (via the deployments API) and reads its
#     `environment` field the same way. Useful to smoke the workflow before it's
#     on main (a deployment_status workflow only fires once its file is on the
#     default branch) or to re-run E2E on demand.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to target (its Railway env is looked up via the deployments API)"
        required: true
        type: string
      atlas_preview_canary_pr:
        description: "Optional next-gen-atlas PR number for the pinned preview canary"
        required: false
        type: string
      atlas_preview_canary_sha:
        description: "Required with atlas_preview_canary_pr: exact current head SHA to test"
        required: false
        type: string

jobs:
  # Always runs on deployment_status so we can see exactly what Railway emits
  # (state, environment, environment_url, …) even when the e2e job is skipped.
  # Remove once the e2e gate below is confirmed firing on PR envs.
  debug-deployment:
    if: github.event_name == 'deployment_status'
    runs-on: ubuntu-latest
    steps:
      - name: Dump deployment_status payload
        env:
          DEPLOYMENT_STATUS: ${{ toJSON(github.event.deployment_status) }}
          DEPLOYMENT: ${{ toJSON(github.event.deployment) }}
        run: |
          echo "state=${{ github.event.deployment_status.state }}"
          echo "environment=${{ github.event.deployment_status.environment }}"
          echo "environment_url=${{ github.event.deployment_status.environment_url }}"
          echo "::group::deployment_status"; echo "$DEPLOYMENT_STATUS"; echo "::endgroup::"
          echo "::group::deployment"; echo "$DEPLOYMENT"; echo "::endgroup::"

  e2e:
    # Manual dispatch always runs. For deployment_status, gate on a successful
    # PR-environment deploy. Railway's `environment` is like
    # "Redline Atlas / pr-85d143-128" (a random per-environment slug, then the PR
    # number), while `environment_url` is the Railway *console* link, not the
    # app — so we gate on `environment` containing 'pr-' (prod envs don't) and
    # derive the app URL below.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       contains(github.event.deployment_status.environment, 'pr-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve target URL
        id: target
        env:
          ENV_NAME: ${{ github.event.deployment_status.environment }}
          PR_INPUT: ${{ github.event.inputs.pr }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR="${PR_INPUT}"
            # The env slug (e.g. "pr-85d143-128") embeds a random component
            # assigned once per PR environment — not derivable from the PR
            # number alone, but stable across redeploys, so look up the most
            # recent deployment GitHub has recorded for this PR and read its
            # real `environment` field instead of guessing.
            ENV_NAME="$(gh api "repos/${{ github.repository }}/deployments?per_page=100" \
              --jq "[.[] | select(.environment | test(\"-${PR}\$\"))] | sort_by(.created_at) | last | .environment")"
            if [ -z "$ENV_NAME" ] || [ "$ENV_NAME" = "null" ]; then
              echo "no recorded deployment found for PR #${PR}" >&2
              exit 1
            fi
          fi
          # "Redline Atlas / pr-85d143-128" -> "pr-85d143-128"
          SLUG="$(printf '%s' "$ENV_NAME" | awk -F'/' '{print $NF}' | xargs)"
          if [ -z "$SLUG" ]; then
            echo "could not parse an environment slug from '${ENV_NAME}'" >&2
            exit 1
          fi
          echo "url=https://redlens-${SLUG}.up.railway.app" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Let preview deploy settle
        run: sleep 60

      - name: Run E2E
        run: pnpm test:e2e
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
          # Lets the opt-in preview canary query the GitHub API without hitting
          # the 60/hr unauthenticated limit. Normal PR deploy runs skip it.
          GITHUB_TOKEN: ${{ github.token }}
          ATLAS_PREVIEW_CANARY_PR: ${{ github.event.inputs.atlas_preview_canary_pr }}
          ATLAS_PREVIEW_CANARY_SHA: ${{ github.event.inputs.atlas_preview_canary_sha }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
