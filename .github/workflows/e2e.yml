name: E2E

# Two ways in:
#  1. deployment_status — Railway emits this when a per-PR environment finishes
#     deploying. Keying off `state == success` removes the "tests started before
#     the deploy was ready" race; we further scope to PR envs via the
#     deterministic hostname (redlens-redlens-pr-<N>.up.railway.app) so
#     production deploys don't trigger the suite.
#  2. workflow_dispatch — manual run against any PR number, deriving the same
#     deterministic URL. Useful to smoke the workflow before it's on main (a
#     deployment_status workflow only fires once its file is on the default
#     branch) or to re-run E2E on demand.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to target (https://redlens-redlens-pr-<N>.up.railway.app)"
        required: true
        type: string

jobs:
  # Always runs on deployment_status so we can see exactly what Railway emits
  # (state, environment, environment_url, …) even when the e2e job is skipped.
  # Remove once the e2e gate below is confirmed firing on PR envs.
  debug-deployment:
    if: github.event_name == 'deployment_status'
    runs-on: ubuntu-latest
    steps:
      - name: Dump deployment_status payload
        env:
          DEPLOYMENT_STATUS: ${{ toJSON(github.event.deployment_status) }}
          DEPLOYMENT: ${{ toJSON(github.event.deployment) }}
        run: |
          echo "state=${{ github.event.deployment_status.state }}"
          echo "environment=${{ github.event.deployment_status.environment }}"
          echo "environment_url=${{ github.event.deployment_status.environment_url }}"
          echo "::group::deployment_status"; echo "$DEPLOYMENT_STATUS"; echo "::endgroup::"
          echo "::group::deployment"; echo "$DEPLOYMENT"; echo "::endgroup::"

  e2e:
    # Manual dispatch always runs. For deployment_status, gate on a successful
    # deploy whose URL is a Railway preview host — loosened from a brittle 'pr-'
    # substring (the real hostname may not contain it). contains() on a null URL
    # is false, so a missing environment_url safely skips. Tighten once the
    # debug-deployment job above confirms the real payload shape.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       contains(github.event.deployment_status.environment_url, 'up.railway.app'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve target URL
        id: target
        env:
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url }}
          PR_INPUT: ${{ github.event.inputs.pr }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "url=https://redlens-redlens-pr-${PR_INPUT}.up.railway.app" >> "$GITHUB_OUTPUT"
          else
            echo "url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E
        run: pnpm test:e2e
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
          # Lets the preview spec query the GitHub API (open PRs + changed files)
          # without hitting the 60/hr unauthenticated limit.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
