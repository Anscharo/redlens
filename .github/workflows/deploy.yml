name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      # Source code + bundle config
      - "src/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "package.json"
      - "pnpm-lock.yaml"
      # Committed data artifacts (on-chain; curated)
      - "public/addresses.json"
      - "public/chain-state.json"
      - "public/processes.json"
      - "public/processes-ignored.json"
      # Atlas content (submodule pointer change)
      - "vendor/next-gen-atlas"
      # Build pipeline scripts
      - "scripts/required/**"
      - "scripts/lib/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Atlas-derived artifacts are no longer committed to git — build them
      # ephemerally here for the Pages preview bundle. History is served via the
      # Railway API; the history tab shows empty on Pages (no backend), which the
      # UI handles gracefully. build:addresses / build:snapshot are on-chain data
      # with separate cadence and are still committed (committed artifacts load fine
      # in Pages since they remain in git).
      - name: Build atlas artifacts
        run: pnpm build:index && pnpm build:graph && pnpm build:glossary && pnpm build:manifest

      - run: pnpm build:ts && pnpm build:vite

      - name: SPA fallback (copy index.html → 404.html)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
