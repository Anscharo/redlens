name: Deploy to GitHub Pages

# The app now lives at https://atlas.redline.support/ (Railway). GitHub Pages is
# kept only as a redirect stub so old links to anscharo.github.io/redlens/* still
# land users on the live site. The build-and-deploy of the full Vite app has been
# retired in favor of publishing a single redirect page (index.html doubles as the
# SPA 404.html so deep links forward too).

on:
  push:
    branches: [main]
    paths:
      - "gh-pages-redirect/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Assemble redirect site
        run: |
          mkdir -p dist
          cp gh-pages-redirect/index.html dist/index.html
          # SPA fallback: any /redlens/<deep-link> 404s to this, which forwards too.
          cp gh-pages-redirect/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
