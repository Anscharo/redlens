name: Atlas Submodule Update

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Bump submodule even if atlas SHA hasn't changed"
        type: boolean
        default: false
      max_doc_drop:
        description: "Share of documents allowed to disappear in one bump (0-1). Raise only to accept a deliberate upstream deletion."
        type: string
        default: "0.1"
  schedule:
    # Hourly. Self-aborts if the atlas submodule SHA hasn't advanced.
    - cron: "0 * * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    # This environment holds ETHERSCAN_API_KEY (for the address refresh below)
    # and the ATLAS_BOT GitHub App credentials. The App token is what lets the
    # bump push to a branch + open a PR whose events trigger downstream
    # workflows (CI on the PR, the @claude mention on the drift issue) — events
    # from the default GITHUB_TOKEN never trigger other workflows.
    environment: atlas-update-main-bypass
    steps:
      # Mint a short-lived installation token from the ATLAS_BOT App so all
      # git/gh operations below act as the App, not github-actions[bot].
      - name: Generate ATLAS_BOT app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ATLAS_BOT_APP_ID }}
          private-key: ${{ secrets.ATLAS_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Check for atlas update
        id: atlas
        run: |
          OLD=$(git -C vendor/next-gen-atlas rev-parse HEAD)
          git -C vendor/next-gen-atlas fetch origin main
          git -C vendor/next-gen-atlas checkout origin/main
          NEW=$(git -C vendor/next-gen-atlas rev-parse HEAD)
          echo "old=${OLD:0:7}" >> "$GITHUB_OUTPUT"
          echo "short=${NEW:0:7}" >> "$GITHUB_OUTPUT"
          echo "old_full=$OLD" >> "$GITHUB_OUTPUT"
          echo "new_full=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$OLD" != "$NEW" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Atlas advanced: ${OLD:0:7} → ${NEW:0:7}"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Already at latest (${OLD:0:7})."
          fi

      # census:risk, census:concepts and census:chains run under bun (they import
      # src/lib/riskRules.ts / conceptsCensus.ts / explorer.ts directly).
      - uses: oven-sh/setup-bun@v2
        if: steps.atlas.outputs.proceed == 'true'

      - uses: pnpm/action-setup@v6
        if: steps.atlas.outputs.proceed == 'true'

      - uses: actions/setup-node@v4
        if: steps.atlas.outputs.proceed == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.atlas.outputs.proceed == 'true'
        run: pnpm install --frozen-lockfile

      # All build warnings ([drift], anchor-not-found, did-not-parse, unknown
      # document type, …) go through console.warn → stderr. Capture stderr
      # wholesale so any future warning is surfaced without a grep allowlist.
      - name: Build index
        if: steps.atlas.outputs.proceed == 'true'
        run: pnpm build:index 2> >(tee -a /tmp/atlas-warnings.log >&2)

      # MERGE GATE. This PR auto-merges, so nothing downstream is watching: an
      # atlas the build could not fully read would land on main unattended and
      # from there into Postgres and the live site. Runs BEFORE the commit,
      # push, and PR steps, so a bad bump never becomes a mergeable PR at all.
      #
      # `--against` compares with the atlas commit we are bumping FROM, so a
      # mass upstream deletion also stops here for review. To accept one
      # deliberately, re-run this workflow with a higher `max_doc_drop`.
      - name: Verify the build read the whole atlas
        if: steps.atlas.outputs.proceed == 'true'
        env:
          ATLAS_MAX_DOC_DROP: ${{ inputs.max_doc_drop || '0.1' }}
        run: pnpm check:atlas --against "${{ steps.atlas.outputs.old_full }}"

      # Refresh the committed, Etherscan-enriched addresses.json so on-chain
      # addresses introduced by the bump are present — otherwise docs.json gains
      # refs that addresses.json lacks and CI's docs↔addresses sync check drifts.
      #
      # ORDER IS LOAD-BEARING: this runs BEFORE build:graph + test:snap:update.
      # Address-derived edges (e.g. proxies_to) read public/addresses.json, so
      # the snapshot must be generated from the SAME addresses.json this commit
      # ships. Running it afterwards left the committed snapshot stale vs the
      # committed addresses.json, failing CI's snapshot check on every later PR.
      # Needs docs.json from build:index to pick up addresses the bump introduced.
      #
      # Degrades gracefully: build:addresses no-ops without ETHERSCAN_API_KEY,
      # and continue-on-error keeps a flaky Etherscan/RPC call from blocking the
      # bump — build:graph then just reuses the existing addresses.json, which is
      # still internally consistent with the snapshot built from it.
      - name: Refresh on-chain address metadata
        if: steps.atlas.outputs.proceed == 'true'
        continue-on-error: true
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: pnpm build:addresses 2> >(tee -a /tmp/atlas-warnings.log >&2)

      # Build the graph and refresh the snapshot LAST, so it reflects the
      # addresses.json refreshed above.
      - name: Rebuild graph and update snapshots
        if: steps.atlas.outputs.proceed == 'true'
        run: |
          pnpm build:graph 2> >(tee -a /tmp/atlas-warnings.log >&2)
          pnpm census:check --update 2> >(tee -a /tmp/atlas-warnings.log >&2)
          pnpm census:govops --update 2> >(tee -a /tmp/atlas-warnings.log >&2)
          pnpm census:risk --update 2> >(tee -a /tmp/atlas-warnings.log >&2)
          pnpm census:concepts --update 2> >(tee -a /tmp/atlas-warnings.log >&2)
          pnpm census:chains --update 2> >(tee -a /tmp/atlas-warnings.log >&2)
          pnpm test:snap:update
          git diff --stat -- graph-snapshots/__snapshots__ > /tmp/snapshot-diff.txt || true

      # The syntax spec changing is the leading indicator of a new structural
      # convention — flag it even when the build is warning-free.
      - name: Detect syntax spec changes
        if: steps.atlas.outputs.proceed == 'true'
        run: |
          git -C vendor/next-gen-atlas diff \
            "${{ steps.atlas.outputs.old_full }}" "${{ steps.atlas.outputs.new_full }}" \
            -- ATLAS_MARKDOWN_SYNTAX.md > /tmp/spec-diff.txt || true

      - name: Commit and push to atlas-update branch
        if: steps.atlas.outputs.proceed == 'true'
        id: push
        run: |
          SHORT="${{ steps.atlas.outputs.short }}"
          BRANCH="atlas-update/${SHORT}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          # public/addresses.json + .cache/etherscan are refreshed by the
          # address step above (no-op when ETHERSCAN_API_KEY is absent, so the
          # add is harmless then). Keeping them in the bump commit prevents
          # addresses.json from drifting out of sync with docs.json over time.
          git add vendor/next-gen-atlas graph-snapshots/__snapshots__ \
            .github/atlas-census-baseline.json .github/govops-census-baseline.json \
            .github/risk-census-baseline.json .github/concepts-census-baseline.json \
            .github/chains-census-baseline.json \
            public/addresses.json .cache/etherscan
          git commit -m "chore: bump atlas submodule → ${SHORT}"
          git push origin "$BRANCH" --force
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open or update atlas-update PR
        if: steps.atlas.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          SHORT="${{ steps.atlas.outputs.short }}"
          OLD="${{ steps.atlas.outputs.old }}"
          BRANCH="${{ steps.push.outputs.branch }}"

          gh label create atlas-update --force \
            --color 0075CA \
            --description "Automated atlas submodule bump"

          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open for $BRANCH — nothing to do."
          else
            gh pr create \
              --title "chore: bump atlas submodule → ${SHORT}" \
              --body "Automated atlas submodule bump \`${OLD}\` → \`${SHORT}\`." \
              --label "atlas-update" \
              --base main \
              --head "$BRANCH"
            PR_NUM=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
            gh pr merge "$PR_NUM" --auto --rebase
            echo "Opened PR #${PR_NUM} with auto-merge (rebase) enabled."
          fi

      # A blocked bump is a standing condition, not a transient error: every
      # later hourly run hits the same atlas SHA and fails the same way. Say so
      # once, loudly, instead of leaving a red run in the Actions tab that only
      # the weekly healer sweep would notice.
      - name: Report a blocked bump
        if: failure() && steps.atlas.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh label create atlas-blocked --force \
            --color B60205 \
            --description "An atlas bump failed its safety gate and will not merge"

          TITLE="Atlas bump to ${{ steps.atlas.outputs.short }} is blocked"
          OPEN=$(gh issue list --state open --label atlas-blocked --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$OPEN" ]; then
            echo "Already reported in #$OPEN."
            exit 0
          fi

          gh issue create --title "$TITLE" --label atlas-blocked --body "$(cat <<'BODY'
          The hourly atlas bump `${{ steps.atlas.outputs.old }}` → `${{ steps.atlas.outputs.short }}`
          failed a safety gate and **no PR was opened**. The atlas will stay pinned at
          `${{ steps.atlas.outputs.old }}` — every later hourly run will fail the same way — until
          this is resolved.

          See the run log for which check failed:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          If it was `check:atlas`, the build did not account for every document in the
          atlas source. The usual cause is upstream regrouping its files again (it has
          done so twice: #236 atomized the monolith, #294 consolidated the tree). Add a
          layout arm to `scripts/lib/atlas-source.mjs` and `scripts/lib/atlas-git-source.mjs`,
          then prove the regrouping is content-neutral:

              node scripts/aux/ab-parse-check.mjs vendor/next-gen-atlas <extracted-new-tree>

          If instead upstream deliberately deleted a large share of the atlas, re-run this
          workflow from the Actions tab with a higher `max_doc_drop` to accept it.
          BODY
          )"

      # Surface drift signals in a GitHub issue for analysis. The @claude
      # mention triggers .github/workflows/claude.yml — but ONLY because the
      # issue is created with the ATLAS_BOT App token (events from the default
      # GITHUB_TOKEN never trigger other workflows). The App credentials live in
      # the atlas-update-main-bypass environment, so this is fully automatic.
      - name: Open or update atlas-drift issue
        if: steps.atlas.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          WARN=/tmp/atlas-warnings.log SPEC=/tmp/spec-diff.txt SNAP=/tmp/snapshot-diff.txt
          NEW=/tmp/new-warnings.txt
          RISK=/tmp/risk-census-new.txt
          CONCEPTS=/tmp/concepts-census-new.txt

          # Standing benign warnings live in the baseline — only NEW lines
          # count as drift, so recurring known warnings don't re-open issues
          # on every atlas bump. Accepting a warning as benign = adding its
          # line to .github/atlas-warnings-baseline.txt.
          comm -13 \
            <(sort -u .github/atlas-warnings-baseline.txt) \
            <(sort -u "$WARN" 2>/dev/null || true) > "$NEW" || true

          # risk-census lines are a distinct action item (run pnpm risk:assess
          # + human review before the rating enters the curated artifact), not
          # an extraction-gap to classify — pull them out so they get their own
          # instructions instead of being lumped in with items 1-3 below.
          grep '^\[drift\] risk-census:' "$NEW" > "$RISK" || true

          # concepts-census lines are analyst-catalog work (docs/crossview/concepts.md
          # review under the analyst-crossview skill), not an extraction-gap to
          # classify against the parse-atlas skill — pull them out the same way
          # risk-census lines are, so they get their own routing instead of
          # falling into the generic item-1 bucket.
          grep '^\[drift\] concepts-census:' "$NEW" > "$CONCEPTS" || true

          if [ ! -s "$NEW" ] && [ ! -s "$SPEC" ]; then
            echo "No new build warnings, no spec changes — nothing to surface."
            exit 0
          fi

          {
            echo "@claude The atlas advanced \`${{ steps.atlas.outputs.old }}\` → \`${{ steps.atlas.outputs.short }}\` and the rebuild surfaced signals. Analyze them using the parse-atlas skill (\`.claude/skills/parse-atlas/SKILL.md\`):"
            echo
            echo "1. Classify each NEW warning **except the Risk Rules Assessment backlog lines and the Concepts census lines below** (see items 3-4): **benign** (known limitation — recommend the exact line to append to \`.github/atlas-warnings-baseline.txt\`), **extraction gap** (atlas now encodes a structure no pattern handles — describe the pattern a fix would need), or **atlas content issue** (upstream data problem worth reporting)."
            echo "2. If the syntax spec diff below is non-empty, summarize what changed and which extraction patterns or parser rules it can affect."
            echo "3. If the Risk Rules Assessment backlog section below is non-empty, do NOT run \`pnpm risk:assess\` yourself — it costs real LLM spend, and \`docs/risk-assessment-rubric.md\` requires human review before a rating enters the curated artifact. Just summarize which rows are new/changed in your comment so a human can decide when to run it."
            echo "4. If the Concepts census drift section below is non-empty, this is analyst-catalog work, not a parser fix — use the analyst-crossview skill (\`.claude/skills/analyst-crossview/SKILL.md\`) to triage each new/changed row against \`docs/crossview/concepts.md\`'s existing censuses, then run \`pnpm census:concepts --update\` once the doc reflects them."
            echo "5. Post your analysis as a comment. If everything is benign and already documented, say so and close this issue — but leave it open if the risk-census section is non-empty; that item needs a human to run \`pnpm risk:assess\`, not just a comment."
            echo
            if [ -s "$RISK" ]; then
              echo "## Risk Rules Assessment backlog grew"
              echo "New/changed rows since the last accepted baseline — needs \`pnpm risk:assess\`, human review, then \`pnpm census:risk --update\`:"
              echo '```'
              cat "$RISK"
              echo '```'
              echo
            fi
            if [ -s "$CONCEPTS" ]; then
              echo "## Concepts census drift"
              echo "New/changed rows since the last accepted baseline — triage with the analyst-crossview skill against \`docs/crossview/concepts.md\`, then \`pnpm census:concepts --update\`:"
              echo '```'
              cat "$CONCEPTS"
              echo '```'
              echo
            fi
            if [ -s "$NEW" ]; then
              echo "## NEW warnings (not in baseline)"
              echo '```'
              head -c 12000 "$NEW"
              echo '```'
              echo
            fi
            if [ -s "$WARN" ]; then
              echo "<details><summary>Full build stderr (including baseline warnings)</summary>"
              echo
              echo '```'
              head -c 12000 "$WARN"
              echo '```'
              echo "</details>"
              echo
            fi
            if [ -s "$SPEC" ]; then
              echo "## ATLAS_MARKDOWN_SYNTAX.md changed"
              echo '```diff'
              head -c 12000 "$SPEC"
              echo '```'
              echo
            fi
            if [ -s "$SNAP" ]; then
              echo "## Graph snapshot diffstat (auto-accepted, for context)"
              echo '```'
              head -c 4000 "$SNAP"
              echo '```'
            fi
          } > /tmp/issue-body.md

          gh label create atlas-drift --force \
            --color D93F0B \
            --description "Build warnings or syntax-spec changes from an atlas update"

          OPEN=$(gh issue list --state open --label atlas-drift --json number --jq '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body-file /tmp/issue-body.md
            echo "Appended to open atlas-drift issue #$OPEN"
          else
            gh issue create \
              --title "Atlas drift signals at ${{ steps.atlas.outputs.short }}" \
              --label atlas-drift \
              --body-file /tmp/issue-body.md
          fi
