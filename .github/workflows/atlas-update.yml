name: Atlas Submodule Update

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Bump submodule even if atlas SHA hasn't changed"
        type: boolean
        default: false
  schedule:
    # Hourly. Self-aborts if the atlas submodule SHA hasn't advanced.
    - cron: "0 * * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: CI
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          # Use the bot PAT so the push is authored by the atlas-updater bot,
          # which is exempt from the branch-protection push restriction on main.
          token: ${{ secrets.ATLAS_BOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Check for atlas update
        id: atlas
        run: |
          OLD=$(git -C vendor/next-gen-atlas rev-parse HEAD)
          git -C vendor/next-gen-atlas fetch origin main
          git -C vendor/next-gen-atlas checkout origin/main
          NEW=$(git -C vendor/next-gen-atlas rev-parse HEAD)
          echo "old=${OLD:0:7}" >> "$GITHUB_OUTPUT"
          echo "short=${NEW:0:7}" >> "$GITHUB_OUTPUT"
          echo "old_full=$OLD" >> "$GITHUB_OUTPUT"
          echo "new_full=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$OLD" != "$NEW" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Atlas advanced: ${OLD:0:7} → ${NEW:0:7}"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Already at latest (${OLD:0:7})."
          fi

      - uses: pnpm/action-setup@v6
        if: steps.atlas.outputs.proceed == 'true'

      - uses: actions/setup-node@v4
        if: steps.atlas.outputs.proceed == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.atlas.outputs.proceed == 'true'
        run: pnpm install --frozen-lockfile

      # All build warnings ([drift], anchor-not-found, did-not-parse, unknown
      # document type, …) go through console.warn → stderr. Capture stderr
      # wholesale so any future warning is surfaced without a grep allowlist.
      - name: Rebuild artifacts and update snapshots
        if: steps.atlas.outputs.proceed == 'true'
        run: |
          pnpm build:index 2> >(tee -a /tmp/atlas-warnings.log >&2)
          pnpm build:graph 2> >(tee -a /tmp/atlas-warnings.log >&2)
          pnpm census:check --update 2> >(tee -a /tmp/atlas-warnings.log >&2)
          pnpm test:snap:update
          git diff --stat -- graph-snapshots/__snapshots__ > /tmp/snapshot-diff.txt || true

      # The syntax spec changing is the leading indicator of a new structural
      # convention — flag it even when the build is warning-free.
      - name: Detect syntax spec changes
        if: steps.atlas.outputs.proceed == 'true'
        run: |
          git -C vendor/next-gen-atlas diff \
            "${{ steps.atlas.outputs.old_full }}" "${{ steps.atlas.outputs.new_full }}" \
            -- ATLAS_MARKDOWN_SYNTAX.md > /tmp/spec-diff.txt || true

      # Push first — atlas updates must land fast and are never gated on the
      # drift analysis below. The bot token (ATLAS_BOT_PAT) is exempt from the
      # branch-protection push restriction; the checkout above persists it.
      - name: Commit updated submodule pointer
        if: steps.atlas.outputs.proceed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vendor/next-gen-atlas graph-snapshots/__snapshots__ .github/atlas-census-baseline.json
          git commit -m "chore: bump atlas submodule → ${{ steps.atlas.outputs.short }}"
          git push

      # Surface drift signals in a GitHub issue for analysis. The @claude
      # mention triggers .github/workflows/claude.yml — but ONLY if the issue
      # is created with a PAT (events from the default GITHUB_TOKEN never
      # trigger other workflows). Configure the ATLAS_BOT_PAT secret (classic
      # PAT, repo scope) to make the analysis fully automatic; without it the
      # issue still opens and a human comment containing "@claude" starts it.
      - name: Open or update atlas-drift issue
        if: steps.atlas.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.ATLAS_BOT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          WARN=/tmp/atlas-warnings.log SPEC=/tmp/spec-diff.txt SNAP=/tmp/snapshot-diff.txt
          NEW=/tmp/new-warnings.txt

          # Standing benign warnings live in the baseline — only NEW lines
          # count as drift, so recurring known warnings don't re-open issues
          # on every atlas bump. Accepting a warning as benign = adding its
          # line to .github/atlas-warnings-baseline.txt.
          comm -13 \
            <(sort -u .github/atlas-warnings-baseline.txt) \
            <(sort -u "$WARN" 2>/dev/null || true) > "$NEW" || true

          if [ ! -s "$NEW" ] && [ ! -s "$SPEC" ]; then
            echo "No new build warnings, no spec changes — nothing to surface."
            exit 0
          fi

          {
            echo "@claude The atlas advanced \`${{ steps.atlas.outputs.old }}\` → \`${{ steps.atlas.outputs.short }}\` and the rebuild surfaced signals. Analyze them using the parse-atlas skill (\`.claude/skills/parse-atlas/SKILL.md\`):"
            echo
            echo "1. Classify each NEW warning: **benign** (known limitation — recommend the exact line to append to \`.github/atlas-warnings-baseline.txt\`), **extraction gap** (atlas now encodes a structure no pattern handles — describe the pattern a fix would need), or **atlas content issue** (upstream data problem worth reporting)."
            echo "2. If the syntax spec diff below is non-empty, summarize what changed and which extraction patterns or parser rules it can affect."
            echo "3. Post your analysis as a comment. If everything is benign and already documented, say so and close this issue."
            echo
            if [ -s "$NEW" ]; then
              echo "## NEW warnings (not in baseline)"
              echo '```'
              head -c 12000 "$NEW"
              echo '```'
              echo
            fi
            if [ -s "$WARN" ]; then
              echo "<details><summary>Full build stderr (including baseline warnings)</summary>"
              echo
              echo '```'
              head -c 12000 "$WARN"
              echo '```'
              echo "</details>"
              echo
            fi
            if [ -s "$SPEC" ]; then
              echo "## ATLAS_MARKDOWN_SYNTAX.md changed"
              echo '```diff'
              head -c 12000 "$SPEC"
              echo '```'
              echo
            fi
            if [ -s "$SNAP" ]; then
              echo "## Graph snapshot diffstat (auto-accepted, for context)"
              echo '```'
              head -c 4000 "$SNAP"
              echo '```'
            fi
          } > /tmp/issue-body.md

          gh label create atlas-drift --force \
            --color D93F0B \
            --description "Build warnings or syntax-spec changes from an atlas update"

          OPEN=$(gh issue list --state open --label atlas-drift --json number --jq '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body-file /tmp/issue-body.md
            echo "Appended to open atlas-drift issue #$OPEN"
          else
            gh issue create \
              --title "Atlas drift signals at ${{ steps.atlas.outputs.short }}" \
              --label atlas-drift \
              --body-file /tmp/issue-body.md
          fi
