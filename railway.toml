# Dockerfile builder. Nixpacks is deprecated and Railpack's slim runtime can't
# carry git + the build toolchain + the submodule .git that the in-process atlas
# updater needs at runtime — so we own the image explicitly. See ./Dockerfile.
[build]
builder = "DOCKERFILE"
# Skip deploys that only touch markdown the app does not bundle (skills, CLAUDE.md,
# plans). Re-include the `?raw` imports — keep in sync with scripts/lib/deploy-skip.mjs.
watchPatterns = [
  "**",
  "!**/*.md",
  "PRIVACY.md",
  "docs/crossview/concepts-audit.md",
  "docs/crossview/concepts.md",
  "docs/risk-assessment-rubric.md",
  "patch-notes.md",
]

[deploy]
startCommand = "bun --silent run start"
# Gate rollouts on readiness (always-200 liveness — see index.ts's own comment
# on /api/health) rather than port-open, bounding the deploy overlap window
# during which two builds serve concurrently.
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
